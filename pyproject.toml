[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "riffle"
version = "0.1.0"
description = "Riffle: find the best photos in your library, locally (CLIP search, culling, export)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.3",
    "imagehash>=4.3",
    "numpy>=1.26",
    "torch>=2.2",
    "open_clip_torch>=2.24",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "tqdm>=4.66",
    "reverse_geocode>=1.6",
    "platformdirs>=4.0",
    "scipy>=1.10",  # taste model (also used by reverse_geocode)
    "scikit-learn>=1.3",  # the Similar map's layout (t-SNE)
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
# Generated captions and tags (JoyCaption, the WD tagger); not in the standalone builds.
captions = [
  "transformers>=5",
  "accelerate",
  "onnxruntime-gpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnxruntime; sys_platform != 'linux' or platform_machine != 'x86_64'",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
riffle = "riffle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riffle = ["defaults/*.yaml", "web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
