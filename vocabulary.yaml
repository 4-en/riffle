# Zero-shot tag vocabulary.
#
# Each family (subject, scene, look) is scored separately: a softmax over its tags,
# then thresholds from config.yaml (tags.<family>.min_prob / max_tags).
#
# An entry is either a plain tag name, or a tag with alternative phrases:
#
#   - cats: [a cat, a kitten, a cat sleeping]
#
# A photo scores a tag by its best-matching phrase (max similarity), so phrases
# of the same tag never compete with each other. Keep tags within a family from
# overlapping (e.g. "cats" and "animals"), because overlapping tags split the
# probability between them. Stick to concrete, visible things.
#
# After editing, run `archive tag` (seconds; reuses stored embeddings).

templates:
  - "a photo of {}"
  - "a photograph of {}"
  - "a street photo of {}"

subject:
  # people
  - people: [a person, a man, a woman, people walking, pedestrians, a couple]
  - a crowd: [a crowd of people, a large crowd, many people in a street, a queue of people]
  - a portrait: [a portrait of a person, a close-up of a face, a person looking at the camera]
  - children: [a child, kids playing, a baby, schoolchildren, a toddler]
  - elderly people: [an old man, an old woman, elderly people sitting, grandparents]
  - street vendors: [a street vendor, a food stall, a hawker selling goods, a fruit seller, a stall keeper]
